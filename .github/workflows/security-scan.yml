# Varredura de segurança (PLAT-1099): gitleaks nos commits novos, em todo push
# (inclusive na base) e uma vez por semana. O relatório vai para o DefectDojo.
#
# Cópia dos jobs "secrets" e "zizmor" de lastro-co/eks-gitops/.github/workflows/security-scan.yml:
# repo público não pode chamar workflow de repo internal. Mudou lá, copiar aqui.
# Runner hospedado pelo GitHub: runner self-hosted não roda código de repo público.
name: Security scan

on:
  push:
  schedule:
    - cron: "26 11 * * 1"

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 do gitleaks_<versão>_linux_x64.tar.gz, conferido contra o
  # checksums.txt da release. Trocar os dois juntos.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # Relatórios lidos pelo importer do DefectDojo a cada 30 min; não precisam durar.
  REPORT_RETENTION_DAYS: "7"
  ZIZMOR_VERSION: "1.31.1"

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      # Só os commits que a branch traz: o histórico antigo é tratado à parte
      # (varredura completa registrada no PLAT-1099), senão todo PR herdaria
      # achados de anos atrás.
      - name: Resolve commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          CANDIDATES: master main prod
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT_NAME" = pull_request ]; then
            range="${PR_BASE_SHA}..HEAD"
          else
            set -f
            is_base=false
            for c in $CANDIDATES; do [ "$c" = "$REF_NAME" ] && is_base=true; done
            if [ "$is_base" = true ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
              # Push na própria base: só o que entrou neste push.
              range="${PUSH_BEFORE}..HEAD"
            else
              # Branch de trabalho: tudo desde a base mais próxima.
              best=""; best_n=""
              for c in $CANDIDATES; do
                git rev-parse --verify --quiet "refs/remotes/origin/$c" >/dev/null || continue
                mb=$(git merge-base HEAD "origin/$c") || continue
                n=$(git rev-list --count "$mb..HEAD")
                if [ -z "$best_n" ] || [ "$n" -lt "$best_n" ]; then best="$mb"; best_n="$n"; fi
              done
              # Sem base conhecida, varre o histórico inteiro: olhar só o HEAD
              # deixaria os outros commits da branch de fora.
              if [ -n "$best" ]; then range="${best}..HEAD"; else range=""; fi
            fi
          fi
          echo "Range: ${range:-histórico inteiro}"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks
        id: gitleaks
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report"
          args=(git . --no-banner --redact --exit-code 1
            --report-format json --report-path "$RUNNER_TEMP/report/gitleaks.json")
          if [ -n "$RANGE" ]; then args+=(--log-opts="$RANGE"); fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}"

      # Mostra no PR o que o gitleaks achou: anotação no arquivo e na linha, e uma
      # tabela no resumo do run. Só regra, arquivo, linha, commit e fingerprint;
      # nunca Secret nem Match, mesmo redigidos.
      - name: Report findings
        if: failure() && steps.gitleaks.outcome == 'failure'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report/gitleaks.json"
          [ -s "$report" ] || exit 0
          # Escapa %, CR e LF, como pede o formato dos workflow commands.
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=gitleaks \(.RuleID)::\(.Description) (commit \(.Commit[0:8])). Fingerprint: \(.Fingerprint)"
            | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' "$report"
          {
            echo "### gitleaks: $(jq length "$report") achado(s)"
            echo
            echo "| Regra | Arquivo | Linha | Commit |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | `\(.Commit[0:8])` |"' "$report"
            echo
            echo "O valor não aparece aqui nem no artifact \`security-scan-gitleaks\` (\`--redact\`)."
            echo "Credencial real: rotacionar e tirar do código."
            echo "Falso positivo (fixture de teste): \`gitleaks:allow\` no fim da linha, ou o fingerprint no \`.gitleaksignore\` do repo."
          } >> "$GITHUB_STEP_SUMMARY"

      # Também quando o gitleaks achou algo (é quando o relatório importa). --redact
      # troca o segredo por REDACTED no JSON.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-gitleaks
          path: ${{ runner.temp }}/report/gitleaks.json
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}
          if-no-files-found: ignore

  zizmor:
    name: Workflows (zizmor)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Política padrão, a do .github/zizmor.yml do eks-gitops: desliga os 6
      # audits abaixo e mantém o resto do persona padrão (dangerous-triggers,
      # cache-poisoning, unpinned-images etc.). O unpinned-uses exige Action de
      # terceiro fixada por SHA e deixa livres as da org (@main de propósito).
      # O repo que tiver .github/zizmor.yml usa o dele.
      #
      # --no-online-audits: o GITHUB_TOKEN do caller não lê os repos privados da
      # org, e um audit online (known-vulnerable-actions, ref-confusion) que
      # consulta lastro-co/eks-gitops aborta o run inteiro ("no audit was
      # performed"). O unpinned-uses não depende da API.
      - name: Run zizmor
        env:
          # Workflows sem achado médio ou alto: achado novo falha o job.
          ENFORCE: "true"
        run: |
          set -euo pipefail
          if ! find .github -name '*.yml' -o -name '*.yaml' 2>/dev/null | grep -q .; then
            echo "Sem YAML em .github/: nada a auditar."; exit 0
          fi
          cfg=.github/zizmor.yml
          if [ ! -f "$cfg" ]; then
            cfg="$RUNNER_TEMP/zizmor.yml"
            cat > "$cfg" <<'YAML'
          rules:
            unpinned-uses:
              config:
                policies:
                  "lastro-co/*": any
                  "*": hash-pin
            ref-confusion: { disable: true }
            template-injection: { disable: true }
            artipacked: { disable: true }
            github-env: { disable: true }
            excessive-permissions: { disable: true }
            secrets-inherit: { disable: true }
          YAML
          fi
          echo "Config: $cfg"
          rc=0
          pipx run "zizmor==${ZIZMOR_VERSION}" --no-online-audits --min-severity medium --config "$cfg" --format github .github || rc=$?
          # 10 a 14: achado (o código sobe com a severidade máxima). Qualquer
          # outro diferente de 0 é erro do zizmor (config, API, pipx) e falha o
          # job mesmo sem enforce, para o scanner não ficar quebrado em silêncio.
          case "$rc" in
            0) echo "zizmor: nenhum achado." ;;
            1[0-4])
              if [ "$ENFORCE" = true ]; then exit "$rc"; fi
              echo "::warning title=zizmor::Achados nos workflows (exit $rc). Só aviso: ENFORCE ainda é false neste repo." ;;
            *) echo "::error title=zizmor::zizmor terminou com código $rc (erro de execução, não achado)."; exit "$rc" ;;
          esac
