name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Push/PR que só muda docs ou config de CI não roda este workflow (PLAT-911).
    # Lista de exclusão: arquivo novo que o build/teste leia continua disparando.
    paths:
      - "**"
      - "!*.md"
      - "!**/README.md"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
      - "!docs/**"
      - "!.claude/**"
      - "!.coderabbit.yaml"
      - "!.github/**"
      - ".github/workflows/ci.yml"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ vars.RUNNER_X64 || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm biome ci .

      - name: Run tests
        run: pnpm run test

      - name: Type check
        run: pnpm run type-check
        if: hashFiles('tsconfig.json') != ''

      - name: Build check
        run: pnpm run build
